<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Private Chat</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101418;color:#e9eef2;font:16px system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column;max-width:760px;margin-inline:auto;padding:12px}header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 2px 14px;border-bottom:1px solid #2a333b}#status{font-size:12px;color:#aebbc5}#chat-box{flex:1;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:14px 0}.msg{max-width:84%;padding:10px 13px;border-radius:14px;overflow-wrap:anywhere;white-space:pre-wrap}.mine{align-self:flex-end;background:#075e54}.theirs{align-self:flex-start;background:#26313a}.sys{align-self:center;color:#9aa8b3;font-size:12px;text-align:center}.controls{display:flex;gap:8px;padding:8px 0}.controls input{min-width:0;flex:1;background:#202a32;color:white;border:1px solid #394650;border-radius:10px;padding:12px;font-size:16px}.controls button,header button{border:0;border-radius:10px;background:#2478d4;color:white;font-weight:600;padding:10px 14px}button:disabled,input:disabled{opacity:.45}#typing{min-height:18px;color:#aebbc5;font-size:12px}#tools{display:flex;gap:8px}#tools button{background:#36434d}
</style></head>
<body>
<header><div><strong>Private Chat</strong><div id="status">Connecting…</div></div><div id="tools"><button id="clearBtn" type="button">Clear chat</button></div></header>
<div id="chat-box" aria-live="polite"></div><div id="typing"></div>
<form class="controls" id="form"><input id="msgInput" maxlength="4000" placeholder="Type a message…" autocomplete="off" disabled><button id="sendBtn" disabled>Send</button></form>
<script>
'use strict';
const WS_URL='wss://autumn-moon-1de2.injamam-official-18.workers.dev/ws';
const chatBox=document.getElementById('chat-box'), statusEl=document.getElementById('status'), input=document.getElementById('msgInput'), sendBtn=document.getElementById('sendBtn'), form=document.getElementById('form'), typingEl=document.getElementById('typing');
const hash=location.hash.slice(1); const isOwner=hash.length>0; let credential=hash, ws, keyPair, aesKey, peerKeyB64=null, peerKeyImport=null, ready=false, typingTimer, typingActive=false; const messages=new Map();
function log(s){const d=document.createElement('div');d.className='sys';d.textContent=s;chatBox.appendChild(d);chatBox.scrollTop=chatBox.scrollHeight;}
function b64(bytes){let bin='';for(const b of new Uint8Array(bytes))bin+=String.fromCharCode(b);return btoa(bin)}
function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function makeKeys(){keyPair=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},false,['deriveBits']);return b64(await crypto.subtle.exportKey('raw',keyPair.publicKey));}
async function deriveKey(pub){const peer=await crypto.subtle.importKey('raw',unb64(pub),{name:'ECDH',namedCurve:'P-256'},false,[]);const bits=await crypto.subtle.deriveBits({name:'ECDH',public:peer},keyPair.privateKey,256);const hk=await crypto.subtle.importKey('raw',bits,'HKDF',false,['deriveKey']);return crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt:new Uint8Array(32),info:new TextEncoder().encode('private-chat-v1')},hk,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function encrypt(text){const iv=crypto.getRandomValues(new Uint8Array(12));const data=await crypto.subtle.encrypt({name:'AES-GCM',iv},aesKey,new TextEncoder().encode(text));return JSON.stringify({iv:b64(iv),data:b64(data)});}
async function decrypt(cipher){const o=JSON.parse(cipher);const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},aesKey,unb64(o.data));return new TextDecoder().decode(clear);}
function display(text,id,mine){const d=document.createElement('div');d.className='msg '+(mine?'mine':'theirs');d.textContent=text;chatBox.appendChild(d);chatBox.scrollTop=chatBox.scrollHeight;messages.set(id,{node:d,seen:!mine,timer:!mine?setTimeout(()=>deleteMessage(id),30000):null});if(!mine&&ws?.readyState===1)ws.send(JSON.stringify({type:'seen',id}));}
function deleteMessage(id){const m=messages.get(id);if(m){clearTimeout(m.timer);m.node.remove();messages.delete(id);}}
function enableIfReady(){if(ready&&aesKey){input.disabled=false;sendBtn.disabled=false;statusEl.textContent='Encrypted session connected';}}
async function connect(){try{if(!isOwner){credential=prompt('Enter guest code:');if(!credential){log('Guest code is required.');return;}}statusEl.textContent='Generating session keys…';const pub=await makeKeys();ws=new WebSocket(WS_URL);ws.onopen=()=>{statusEl.textContent='Authenticating…';ws.send(JSON.stringify(isOwner?{type:'auth',role:'owner',accessToken:credential}:{type:'auth',role:'guest',code:credential}));};ws.onmessage=async ev=>{let m;try{m=JSON.parse(ev.data)}catch{return}
if(m.type==='ready'){ready=true;statusEl.textContent='Authenticated; exchanging keys…';ws.send(JSON.stringify({type:'pubkey',key:pub}));if(peerKeyB64){aesKey=await deriveKey(peerKeyB64);enableIfReady();}return;}
if(m.type==='auth_error'){log('Authentication failed. Check the access link or guest code.');return;}
if(m.type==='already_connected'){log('This role is already connected in another tab/device.');return;}
if(m.type==='guest_status'&&isOwner){statusEl.textContent=m.online?'Guest online':'Guest offline';return;}
if(m.type==='pubkey'){if(typeof m.key!=='string'||m.key===pub)return;peerKeyB64=m.key;if(ready){aesKey=await deriveKey(peerKeyB64);enableIfReady();}return;}
if(m.type==='message'){if(!aesKey){log('Received data before key setup; ignored.');return;}try{const text=await decrypt(m.ciphertext);display(text,m.id,false);}catch{log('Could not decrypt message.');}return;}
if(m.type==='seen'){const x=messages.get(m.id);if(x&&!x.seen){x.seen=true;clearTimeout(x.timer);x.timer=setTimeout(()=>deleteMessage(m.id),30000);}return;}
if(m.type==='typing'){typingEl.textContent=m.active?'Peer is typing…':'';clearTimeout(typingTimer);if(m.active)typingTimer=setTimeout(()=>typingEl.textContent='',2500);return;}
if(m.type==='clear'){for(const id of [...messages.keys()])deleteMessage(id);log('Chat cleared for this session.');return;}
if(m.type==='peer_offline'){log('Peer is offline. Message was not queued or delivered.');return;}
if(m.type==='invalid_message')log('Relay rejected an invalid message.');};
ws.onerror=()=>{statusEl.textContent='Connection error';};ws.onclose=e=>{ready=false;aesKey=null;input.disabled=true;sendBtn.disabled=true;statusEl.textContent='Disconnected ('+e.code+')';log('Connection closed: '+e.code+(e.reason?' — '+e.reason:''));};
}catch(e){statusEl.textContent='Setup failed';log('Secure session setup failed. Please reload and try again.');console.error(e);}}
form.addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text||!aesKey||ws?.readyState!==1)return;const id=crypto.randomUUID();try{const ciphertext=await encrypt(text);ws.send(JSON.stringify({type:'message',id,ciphertext}));display(text,id,true);input.value='';if(typingActive){typingActive=false;ws.send(JSON.stringify({type:'typing',active:false}));}}catch(e){log('Message encryption failed.');}});
input.addEventListener('input',()=>{if(!ready||ws?.readyState!==1)return;const active=!!input.value;if(active!==typingActive){typingActive=active;ws.send(JSON.stringify({type:'typing',active}));}clearTimeout(typingTimer);if(active)typingTimer=setTimeout(()=>{typingActive=false;if(ws?.readyState===1)ws.send(JSON.stringify({type:'typing',active:false}));},1800);});
document.getElementById('clearBtn').addEventListener('click',()=>{for(const id of [...messages.keys()])deleteMessage(id);if(ws?.readyState===1)ws.send(JSON.stringify({type:'clear'}));log('Chat cleared for this session.');});
connect();
</script></body></html>
